[project]
name = "agent-storefront"
version = "0.1.0"
description = "Agent Storefront — Reference Implementation for AI Growth & Agentic Commerce (Razorpay AI Buildathon 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "buyer_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
